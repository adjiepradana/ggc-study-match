name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare and verify published files
        run: |
          mkdir -p _site
          cp -R ggc-assesment-system/assets ggc-assesment-system/css ggc-assesment-system/js _site/
          cp ggc-assesment-system/index.html ggc-assesment-system/login.html _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/login.html
          find _site -maxdepth 2 -type f | sort
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
